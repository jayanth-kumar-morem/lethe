[package]
name = "lethe"
description = "LETHE: an information market where the AI forgets. Sealed info is inspected by an enclave against the buyer's own sealed notes; the contract enforces price rules, verifies TEE-signed AI receipts, settles or refunds."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jayanth-kumar-morem/lethe"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "unstable"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
